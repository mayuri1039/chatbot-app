<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <link rel="stylesheet" href="/static/style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🤖</text></svg>">
</head>
<body>
    <div class="mobile-nav">
        <button class="menu-btn" id="menu-btn">☰</button>
        <span>New Chat</span>
    </div>

    <div id="sidebar">
        <button class="new-chat-btn">
            <span>+</span> New chat
        </button>
        
        <div class="history-list">
            <!-- Future history items will go here -->
        </div>

        <div class="sidebar-footer">
            <div style="padding: 10px;">
                Made with ❤️
            </div>
        </div>
    </div>

    <main id="main-chat">
        <div id="chat-container">
            <div class="welcome-screen" id="welcome-screen">
                <h1>AI Chatbot</h1>
                <p>Ask anything related to AI, coding, or general knowledge.</p>
            </div>
            <!-- Messages will be appended here -->
        </div>

        <div class="input-area-container">
            <div class="input-box-wrapper">
                <textarea id="user-input" rows="1" placeholder="Send a message..."></textarea>
                <button id="send-btn" disabled>
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="1em" width="1em" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </div>
        </div>
    </main>

    <script src="/static/script.js"></script>
</body>
</html>
